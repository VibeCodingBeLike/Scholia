name: Release & Publish to GitHub Releases

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: Scholia-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: Scholia-macos-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: Scholia-macos-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: Scholia-linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Semantic Version
        id: semver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "Building Scholia for tag: ${TAG}"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev libgtk-3-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ]; then
            # Verify tests compile for x86_64 target on ARM64 runner without executing incompatible host binaries
            cargo test --release --target ${{ matrix.target }} --no-run
          else
            cargo test --release --target ${{ matrix.target }}
          fi

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging on Windows
      - name: Package Windows Artifacts (Portable & Installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $verNum = $ver.TrimStart('v')
          $pkgDir = "dist\Scholia-$ver-windows-x64"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item "target\${{ matrix.target }}\release\scholia.exe" -Destination "$pkgDir\"
          Copy-Item "LICENSE" -Destination "$pkgDir\"
          Copy-Item "README.md" -Destination "$pkgDir\"
          $zipName = "Scholia-$ver-windows-x64.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "dist\$zipName" -Force
          Write-Host "Created dist\$zipName"

          # Build Inno Setup Installer for File Associations (.mla, .mladoc)
          Write-Host "Installing Inno Setup..."
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $isccCmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($isccCmd) { $iscc = $isccCmd.Source }
          }
          $exeSource = "$PWD\target\${{ matrix.target }}\release\scholia.exe"
          $outDir = "$PWD\dist"
          $setupBase = "Scholia-$ver-windows-x64-Setup"
          & $iscc "/DMyAppVersion=$verNum" "/DMyAppExeSource=$exeSource" "/DOutputDir=$outDir" "/DOutputBaseFilename=$setupBase" "installers\windows\installer.iss"
          if (Test-Path "dist\$setupBase.exe") {
            Write-Host "Created dist\$setupBase.exe"
          } else {
            Write-Error "Failed to produce installer dist\$setupBase.exe"
            exit 1
          }

      # Packaging on macOS
      - name: Package macOS Artifacts (Portable & DMG Installer)
        if: runner.os == 'macOS'
        run: |
          TAG="${{ steps.semver.outputs.VERSION }}"
          VER="${TAG#v}"
          ARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}"

          # 1. Portable ZIP
          PKG_DIR="dist/Scholia-${TAG}-macos-${ARCH}"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/scholia" "$PKG_DIR/"
          cp LICENSE "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          cd dist && zip -r "Scholia-${TAG}-macos-${ARCH}.zip" "Scholia-${TAG}-macos-${ARCH}"
          cd ..
          echo "Created dist/Scholia-${TAG}-macos-${ARCH}.zip"

          # 2. App Bundle (.app) with Info.plist file association
          BUNDLE_DIR="dist/bundle_${ARCH}/Scholia.app"
          CONTENTS_DIR="${BUNDLE_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          mkdir -p "${MACOS_DIR}"
          mkdir -p "${CONTENTS_DIR}/Resources"
          cp "target/${{ matrix.target }}/release/scholia" "${MACOS_DIR}/scholia"
          chmod +x "${MACOS_DIR}/scholia"
          cp "installers/macos/Info.plist" "${CONTENTS_DIR}/Info.plist"
          sed -i.bak "s/0.1.0/${VER}/g" "${CONTENTS_DIR}/Info.plist" && rm -f "${CONTENTS_DIR}/Info.plist.bak"

          # 3. Native DMG installer with Applications drag-and-drop link
          DMG_STAGING="dist/dmg_staging_${ARCH}"
          mkdir -p "$DMG_STAGING"
          cp -R "${BUNDLE_DIR}" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "Scholia" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist/Scholia-${TAG}-macos-${ARCH}.dmg"
          rm -rf "$DMG_STAGING"
          echo "Created dist/Scholia-${TAG}-macos-${ARCH}.dmg"

      # Packaging on Linux
      - name: Package Linux Artifacts (Portable & Debian Package)
        if: runner.os == 'Linux'
        run: |
          TAG="${{ steps.semver.outputs.VERSION }}"
          VER="${TAG#v}"

          # 1. Portable tar.gz
          PKG_DIR="dist/Scholia-${TAG}-linux-x64"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/scholia" "$PKG_DIR/"
          cp LICENSE "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          cd dist && tar -czvf "Scholia-${TAG}-linux-x64.tar.gz" "Scholia-${TAG}-linux-x64"
          cd ..
          echo "Created dist/Scholia-${TAG}-linux-x64.tar.gz"

          # 2. Debian Package (.deb) with MIME and desktop file associations
          DEB_DIR="target/debian/scholia_${VER}_amd64"
          rm -rf "${DEB_DIR}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/mime/packages"
          mkdir -p "${DEB_DIR}/usr/share/doc/scholia"

          cp "target/${{ matrix.target }}/release/scholia" "${DEB_DIR}/usr/bin/scholia"
          chmod 755 "${DEB_DIR}/usr/bin/scholia"

          cp "installers/linux/scholia.desktop" "${DEB_DIR}/usr/share/applications/scholia.desktop"
          cp "installers/linux/scholia.xml" "${DEB_DIR}/usr/share/mime/packages/scholia.xml"
          cp "README.md" "${DEB_DIR}/usr/share/doc/scholia/"
          cp "LICENSE" "${DEB_DIR}/usr/share/doc/scholia/copyright"

          cat <<EOF > "${DEB_DIR}/DEBIAN/control"
          Package: scholia
          Version: ${VER}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Scholia Authors <info@scholia.editor>
          Description: Modern, distraction-free MLA 9th edition document editor
           Scholia enforces strict adherence to MLA 9 guidelines while providing
           a customizable frosted glass interface, custom keybindings, and high-fidelity
           export to DOCX, HTML/PDF, and Markdown.
          EOF

          dpkg-deb --build "${DEB_DIR}" "dist/Scholia-${TAG}-linux-x64.deb"
          echo "Created dist/Scholia-${TAG}-linux-x64.deb"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.deb
          retention-days: 1

  publish-release:
    name: Publish to GitHub Releases
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Semantic Version
        id: semver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.0"
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: Generate SHA256 Checksums
        id: checksums
        shell: bash
        run: |
          mkdir -p final-assets
          cp release-downloads/*.zip release-downloads/*.tar.gz release-downloads/*.exe release-downloads/*.dmg release-downloads/*.deb final-assets/ 2>/dev/null || true
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.VERSION }}
          name: "Scholia ${{ steps.semver.outputs.VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            final-assets/*.zip
            final-assets/*.tar.gz
            final-assets/*.exe
            final-assets/*.dmg
            final-assets/*.deb
            final-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
